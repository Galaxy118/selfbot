<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfbot Manager - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css?v=17">
</head>
<body>
    <div class="container">
        <header class="glass-panel" style="margin-bottom: 2rem; border-radius: var(--radius-md); padding: 1rem 2rem; border: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
            <div class="logo-container">
                <h1 style="margin: 0; font-size: 1.5rem;"><span>◆</span> Selfbot Panel</h1>
            </div>
            <div class="user-info">
                <span id="username-display"></span>
                <a href="/auth/logout" class="glass-button glass-button-danger">Déconnexion</a>
            </div>
        </header>

        <div id="admin-panel" class="admin-panel glass-panel" style="display: none;">
            <div style="flex-grow: 1;">
                <h3 style="color: var(--accent-error);">🛡️ Panneau d'Administration</h3>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">Désactiver arrêtera tous les bots instantanément.</p>
            </div>
            <label class="switch-container">
                <input type="checkbox" id="global-active-toggle">
                <span class="switch-slider"></span>
            </label>
        </div>

        <div class="add-token-section glass-panel">
            <h2>Ajouter un Token</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem;">Collez votre token Discord ci-dessous pour démarrer un nouveau selfbot.</p>
            <form id="add-token-form" class="add-token-form">
                <input type="password" id="new-token-input" class="glass-input" placeholder="Ex: MTEyMzQ1..." required autocomplete="off">
                <button type="submit" id="add-btn" class="glass-button glass-button-primary">
                    <span class="btn-text">Ajouter</span>
                    <div class="loader hidden"></div>
                </button>
            </form>
            <span id="add-error" class="error-msg"></span>
        </div>

        <div id="tokens-grid" class="grid">
            <!-- Tokens will be injected here via JS -->
        </div>
    </div>

    <!-- Template for a token card -->
    <template id="token-card-template">
        <div class="token-card glass-panel">
            <div class="token-header" style="align-items: flex-start; gap: 1rem;">
                <div class="token-header-info" style="flex-grow: 1; min-width: 0;">
                    <h3 class="token-id-display" style="margin: 0; word-break: break-all;"></h3>
                    <div style="display: flex; gap: 0.5rem; align-items: flex-start; margin-top: 0.5rem; flex-wrap: wrap;">
                        <span class="owner-badge hidden" style="white-space: nowrap;">Propriétaire: <span class="t-owner"></span></span>
                        <span class="connection-status-badge" style="white-space: nowrap;"></span>
                    </div>
                </div>
                <button class="glass-button glass-button-danger delete-btn" title="Supprimer" style="flex-shrink: 0; padding: 6px 12px;">✖</button>
            </div>
            
            <div class="token-body">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="switch-container">
                        <input type="checkbox" class="is-active-checkbox">
                        <span class="switch-slider"></span>
                        <b>Activer le compte</b>
                    </label>
                </div>
                
                <div class="form-group">
                    <label>Statut</label>
                    <select class="status-select glass-input">
                        <option value="online">En ligne</option>
                        <option value="idle">Inactif</option>
                        <option value="dnd">Ne pas déranger</option>
                        <option value="invisible">Invisible</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="margin: 0;">Activités (Rotation)</label>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span style="font-size: 0.75rem; color: var(--text-secondary);">Intervalle (s):</span>
                            <input type="number" class="rotation-interval-input glass-input" value="30" min="15" style="width: 60px; padding: 0.25rem; font-size: 0.8rem;">
                        </div>
                    </div>
                    
                    <div class="activities-list" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem;">
                        <!-- JS injects activities here -->
                    </div>

                    <div style="display: flex; gap: 0.5rem;">
                        <select class="new-activity-type glass-input" style="min-width: 130px; padding: 0.5rem;">
                            <option value="0">Joue à</option>
                            <option value="2">Écoute</option>
                            <option value="3">Regarde</option>
                            <option value="5">Participe à</option>
                        </select>
                        <input type="text" class="new-activity-name glass-input" placeholder="Ex: Spotify" style="flex-grow: 1; padding: 0.5rem; min-width: 0;">
                        <button type="button" class="glass-button glass-button-primary add-activity-btn" style="padding: 0.5rem 1rem;">+</button>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem; margin-bottom: 0.5rem;">
                    <label class="switch-container">
                        <input type="checkbox" class="join-voice-checkbox">
                        <span class="switch-slider"></span>
                        <b>Activer Vocal</b>
                    </label>
                </div>

                <div class="form-group">
                    <label>Serveur Vocal (ID)</label>
                    <input type="text" class="guild-input glass-input" placeholder="ID du serveur">
                </div>
                <div class="form-group">
                    <label>Salon Vocal (ID)</label>
                    <input type="text" class="channel-input glass-input" placeholder="ID du salon">
                </div>
                
                <div class="toggles-grid">
                    <label class="switch-container">
                        <input type="checkbox" class="mute-checkbox">
                        <span class="switch-slider"></span> Mute
                    </label>
                    <label class="switch-container">
                        <input type="checkbox" class="deaf-checkbox">
                        <span class="switch-slider"></span> Sourd
                    </label>
                </div>
                
                <button class="glass-button glass-button-primary update-btn" style="margin-top: 1rem; width: 100%;">Enregistrer les modifications</button>
            </div>
        </div>
    </template>

    <script src="/static/script.js?v=17"></script></body>
</html>
